<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Álbum Copa do Mundo 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C;
    --gold-light: #E8C96A;
    --bg: #0A0E1A;
    --surface: #111827;
    --surface2: #1A2235;
    --border: rgba(201,168,76,0.2);
    --text: #F0EDE6;
    --muted: #8A99B3;
    --green: #2ECC71;
    --red: #E74C3C;
    --orange: #F39C12;
    --blue: #3498DB;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: linear-gradient(135deg, #0A0E1A 0%, #111827 50%, #0A0E1A 100%);
    border-bottom: 1px solid var(--border);
    padding: 1rem 1.5rem;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    flex-wrap: wrap;
  }

  .logo {
    display: flex;
    align-items: baseline;
    gap: 0.4rem;
  }

  .logo-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    color: var(--gold);
    letter-spacing: 2px;
    line-height: 1;
  }

  .logo-year {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    color: var(--muted);
    letter-spacing: 2px;
  }

  /* PROGRESS BAR */
  .progress-section {
    flex: 1;
    min-width: 220px;
  }

  .progress-stats {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 0.4rem;
  }

  .progress-stats strong {
    color: var(--gold);
    font-size: 0.95rem;
  }

  .progress-bar-track {
    height: 6px;
    background: var(--surface2);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  /* CONTROLS */
  .controls {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
  }

  .search-wrap {
    position: relative;
  }

  .search-wrap input {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 0.45rem 0.75rem 0.45rem 2rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    width: 180px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-wrap input:focus { border-color: var(--gold); }
  .search-wrap input::placeholder { color: var(--muted); }

  .search-icon {
    position: absolute;
    left: 0.6rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 0.85rem;
    pointer-events: none;
  }

  .filter-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 0.45rem 0.9rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .filter-btn:hover { border-color: var(--gold); color: var(--text); }
  .filter-btn.active { background: var(--gold); color: #0A0E1A; border-color: var(--gold); font-weight: 600; }

  /* STATS ROW */
  .stats-row {
    max-width: 1200px;
    margin: 1.25rem auto;
    padding: 0 1.5rem;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0.75rem;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem 1rem;
    text-align: center;
  }

  .stat-card .num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.2rem;
    line-height: 1;
    color: var(--gold);
  }

  .stat-card .label {
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 0.2rem;
  }

  /* MAIN CONTENT */
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 1.5rem 3rem;
  }

  /* GROUP SECTION */
  .group-section {
    margin-bottom: 2.5rem;
  }

  .group-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 0.75rem;
  }

  .group-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.3rem;
    color: var(--gold);
    letter-spacing: 2px;
  }

  .group-progress {
    font-size: 0.75rem;
    color: var(--muted);
    background: var(--surface2);
    padding: 0.2rem 0.6rem;
    border-radius: 99px;
    margin-left: auto;
  }

  /* TEAM CARD */
  .teams-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 0.75rem;
  }

  .team-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  .team-card:hover { border-color: rgba(201,168,76,0.5); }

  .team-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.7rem 1rem;
    background: var(--surface2);
    cursor: pointer;
    user-select: none;
  }

  .team-name-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .team-flag {
    font-size: 1.4rem;
    line-height: 1;
  }

  .team-name {
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--text);
  }

  .team-mini-progress {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .team-pct {
    font-size: 0.72rem;
    color: var(--gold);
    font-weight: 600;
  }

  .chevron {
    font-size: 0.7rem;
    color: var(--muted);
    transition: transform 0.25s;
  }

  .team-card.open .chevron { transform: rotate(180deg); }

  /* STICKERS GRID */
  .stickers-wrap {
    display: none;
    padding: 0.75rem;
    gap: 0.4rem;
    flex-wrap: wrap;
  }

  .team-card.open .stickers-wrap { display: flex; }

  .sticker {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.2rem;
    width: 68px;
    cursor: pointer;
    user-select: none;
  }

  .sticker-num {
    font-size: 0.62rem;
    color: var(--muted);
    line-height: 1;
  }

  .sticker-badge {
    width: 50px;
    height: 64px;
    border-radius: 6px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }

  .sticker-badge::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 60%, rgba(255,255,255,0.04));
  }

  .sticker-initial {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    color: var(--muted);
    line-height: 1;
    text-align: center;
    padding: 0 4px;
    font-size: 0.7rem;
    word-break: break-all;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
  }

  .sticker-name {
    font-size: 0.6rem;
    color: var(--muted);
    text-align: center;
    line-height: 1.2;
    max-width: 68px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* sticker states */
  .sticker[data-qty="0"] .sticker-badge {
    background: var(--surface2);
    border-color: rgba(255,255,255,0.06);
    opacity: 0.5;
  }

  .sticker[data-qty="1"] .sticker-badge {
    background: rgba(46,204,113,0.12);
    border-color: rgba(46,204,113,0.5);
  }

  .sticker[data-qty="1"] .sticker-initial { color: var(--green); }

  .sticker[data-qty="2"] .sticker-badge,
  .sticker[data-qty="3"] .sticker-badge,
  .sticker[data-qty="4"] .sticker-badge,
  .sticker[data-qty="5"] .sticker-badge,
  .sticker[data-qty="6"] .sticker-badge,
  .sticker[data-qty="7"] .sticker-badge,
  .sticker[data-qty="8"] .sticker-badge,
  .sticker[data-qty="9"] .sticker-badge {
    background: rgba(243,156,18,0.12);
    border-color: rgba(243,156,18,0.5);
  }

  .sticker[data-qty="2"] .sticker-initial,
  .sticker[data-qty="3"] .sticker-initial,
  .sticker[data-qty="4"] .sticker-initial,
  .sticker[data-qty="5"] .sticker-initial,
  .sticker[data-qty="6"] .sticker-initial,
  .sticker[data-qty="7"] .sticker-initial,
  .sticker[data-qty="8"] .sticker-initial,
  .sticker[data-qty="9"] .sticker-initial { color: var(--orange); }

  .qty-badge {
    position: absolute;
    top: 3px;
    right: 3px;
    background: var(--orange);
    color: #0A0E1A;
    font-size: 0.58rem;
    font-weight: 700;
    border-radius: 99px;
    min-width: 16px;
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 3px;
    display: none;
  }

  .sticker[data-qty="1"] .qty-badge { display: none; }
  .sticker:not([data-qty="0"]):not([data-qty="1"]) .qty-badge { display: flex; background: var(--orange); }

  /* SPECIAL STICKERS */
  .sticker.special .sticker-badge {
    border-color: rgba(201,168,76,0.5);
    background: rgba(201,168,76,0.08);
  }

  .sticker.special[data-qty="0"] .sticker-badge { opacity: 0.5; }

  /* HIDDEN */
  .team-card.hidden,
  .group-section.empty { display: none; }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--muted);
  }

  .empty-state .big { font-size: 3rem; margin-bottom: 0.5rem; }

  /* IMPORT/EXPORT */
  .io-bar {
    max-width: 1200px;
    margin: 0 auto 1.5rem;
    padding: 0 1.5rem;
    display: flex;
    gap: 0.6rem;
    align-items: center;
    flex-wrap: wrap;
  }

  .io-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 0.35rem 0.8rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.78rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  .io-btn:hover { border-color: var(--gold); color: var(--gold); }

  .io-hint { font-size: 0.72rem; color: var(--muted); margin-left: 0.25rem; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.7rem 1.1rem;
    border-radius: 10px;
    font-size: 0.85rem;
    z-index: 999;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.25s;
    pointer-events: none;
  }

  .toast.show { opacity: 1; transform: translateY(0); }

  /* SECTION DIVIDER */
  .section-divider {
    height: 1px;
    background: var(--border);
    margin: 0.5rem 0 1rem;
  }

  /* RESPONSIVE */
  @media (max-width: 700px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .search-wrap input { width: 140px; }
    .logo-title { font-size: 1.5rem; }
    .progress-section { min-width: 150px; }
  }

  @media (max-width: 480px) {
    .header-inner { gap: 0.75rem; }
    .controls { gap: 0.4rem; }
    .filter-btn { padding: 0.4rem 0.6rem; font-size: 0.75rem; }
  }

  /* No results */
  #no-results { display: none; text-align: center; padding: 3rem; color: var(--muted); }
</style>
</head>

<header>

      <span class="logo-year">2026</span>
    </div>
    <div class="progress-section">
      <div class="progress-stats">
        <span>Progresso</span>
        <span><strong id="hdr-have">0</strong> / <strong>980</strong> figurinhas</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
      </div>

    <div class="controls">

      </div>
      <button class="filter-btn active" data-filter="all">Todas</button>
      <button class="filter-btn" data-filter="missing">Faltando</button>
      <button class="filter-btn" data-filter="duplicates">Duplicadas</button>
    </div>
  </div>
</header>

<div class="stats-row">

  </div>
  <div class="stat-card">

    <div class="label">Duplicadas</div>
  </div>
  <div class="stat-card">
    <div class="num" id="stat-pct">0%</div>
    <div class="label">Completo</div>
  </div>
</div>

<div class="io-bar">
  <button class="io-btn" onclick="exportData()">⬇ Exportar progresso</button>
  <button class="io-btn" onclick="document.getElementById('import-input').click()">⬆ Importar progresso</button>
  <input type="file" id="import-input" accept=".json" style="display:none" onchange="importData(event)">
  <button class="io-btn" onclick="resetAll()" style="margin-left:auto; color: var(--red); border-color: rgba(231,76,60,0.3)">↺ Zerar tudo</button>
  <span class="io-hint">Dados salvos automaticamente no navegador</span>
</div>

<main id="main-content">
  <div id="no-results">
    <div style="font-size:2rem;margin-bottom:0.5rem">🔍</div>
    Nenhuma figurinha encontrada
  </div>
</main>

<div class="toast" id="toast"></div>

// Assign sticker numbers per team (18 stickers each)
let stickerOffset = 1;
const TEAM_STICKER_NUMBERS = {};
GROUPS.forEach(g => {
  g.teams.forEach(t => {
    TEAM_STICKER_NUMBERS[t.id] = stickerOffset;
    stickerOffset += t.stickers.length;
  });
});

const TOTAL = 980;

// ─── STATE ───────────────────────────────────────────────────
let quantities = {};
let activeFilter = 'all';
let searchQ = '';

function loadState() {
  try {
    const s = localStorage.getItem('copa2026');
    if (s) quantities = JSON.parse(s);
  } catch(e) {}
}

function saveState() {
  localStorage.setItem('copa2026', JSON.stringify(quantities));
}

function getKey(teamId, idx) { return `${teamId}_${idx}`; }
function getQty(teamId, idx) { return quantities[getKey(teamId, idx)] || 0; }

// ─── UI ──────────────────────────────────────────────────────
function buildUI() {
  const main = document.getElementById('main-content');
  main.innerHTML = '<div id="no-results" style="display:none;text-align:center;padding:3rem;color:var(--muted)"><div style="font-size:2rem;margin-bottom:.5rem">🔍</div>Nenhuma figurinha encontrada</div>';

  GROUPS.forEach(g => {
    const sec = document.createElement('div');
    sec.className = 'group-section';
    sec.id = 'group-' + g.id;

    const hdr = document.createElement('div');
    hdr.className = 'group-header';
    hdr.innerHTML = `
      <span class="group-label">${g.name}</span>
      <div class="section-divider" style="flex:1"></div>
      <span class="group-progress" id="gp-${g.id}">0/72</span>
    `;
    sec.appendChild(hdr);

    const grid = document.createElement('div');
    grid.className = 'teams-grid';

    g.teams.forEach(team => {
      const card = document.createElement('div');
      card.className = 'team-card';
      card.id = 'tc-' + team.id;

      const teamHdr = document.createElement('div');
      teamHdr.className = 'team-header';
      teamHdr.innerHTML = `
        <div class="team-name-row">
          <span class="team-flag">${team.flag}</span>
          <span class="team-name">${team.name}</span>
        </div>
        <div class="team-mini-progress">
          <span class="team-pct" id="tp-${team.id}">0/${team.stickers.length}</span>
          <span class="chevron">▼</span>
        </div>
      `;
      teamHdr.addEventListener('click', () => {
        card.classList.toggle('open');
      });
      card.appendChild(teamHdr);

      const wrap = document.createElement('div');
      wrap.className = 'stickers-wrap';

      const baseNum = TEAM_STICKER_NUMBERS[team.id];
      team.stickers.forEach((name, i) => {
        const stickerNum = baseNum + i;
        const div = document.createElement('div');
        div.className = 'sticker';
        div.dataset.teamId = team.id;
        div.dataset.idx = i;
        div.dataset.name = name.toLowerCase();
        div.dataset.num = stickerNum;
        div.dataset.qty = getQty(team.id, i);

        const initials = name.split(' ').slice(0,2).map(w => w[0]||'').join('').toUpperCase();
        div.innerHTML = `
          <span class="sticker-num">#${stickerNum}</span>
          <div class="sticker-badge">
            <span class="sticker-initial">${initials}</span>
            <div class="qty-badge">${getQty(team.id, i)}x</div>
          </div>
          <span class="sticker-name" title="${name}">${name}</span>
        `;

        div.addEventListener('click', () => incrementSticker(team.id, i, div));
        div.addEventListener('contextmenu', (e) => { e.preventDefault(); decrementSticker(team.id, i, div); });
        wrap.appendChild(div);
      });

      card.appendChild(wrap);
      grid.appendChild(card);
    });

    sec.appendChild(grid);
    main.appendChild(sec);
  });

  updateStats();
  applyFilter();
}

function incrementSticker(teamId, idx, el) {
  const key = getKey(teamId, idx);
  quantities[key] = (quantities[key] || 0) + 1;
  if (quantities[key] > 9) quantities[key] = 0;
  saveState();
  updateStickerEl(el, teamId, idx);
  updateStats();
  applyFilter();
}

function decrementSticker(teamId, idx, el) {
  const key = getKey(teamId, idx);
  quantities[key] = Math.max(0, (quantities[key] || 0) - 1);
  saveState();
  updateStickerEl(el, teamId, idx);
  updateStats();
  applyFilter();
}

function updateStickerEl(el, teamId, idx) {
  const qty = getQty(teamId, idx);
  el.dataset.qty = qty;
  const qb = el.querySelector('.qty-badge');
  if (qb) qb.textContent = qty + 'x';
}

function updateStats() {
  let have = 0, dups = 0;
  GROUPS.forEach(g => {
    g.teams.forEach(t => {
      let teamHave = 0;
      t.stickers.forEach((_, i) => {
        const q = getQty(t.id, i);
        if (q >= 1) { have++; teamHave++; }
        if (q >= 2) dups += q - 1;
      });
      const tpEl = document.getElementById('tp-' + t.id);
      if (tpEl) tpEl.textContent = `${teamHave}/${t.stickers.length}`;
    });
  });

  const missing = TOTAL - have;
  const pct = Math.round(have / TOTAL * 100);

  document.getElementById('stat-have').textContent = have;
  document.getElementById('stat-missing').textContent = missing;
  document.getElementById('stat-dups').textContent = dups;
  document.getElementById('stat-pct').textContent = pct + '%';
  document.getElementById('hdr-have').textContent = have;
  document.getElementById('progress-fill').style.width = pct + '%';

  // Group progress
  GROUPS.forEach(g => {
    let gh = 0, gt = 0;
    g.teams.forEach(t => {
      t.stickers.forEach((_, i) => { gt++; if (getQty(t.id, i) >= 1) gh++; });
    });
    const gp = document.getElementById('gp-' + g.id);
    if (gp) gp.textContent = `${gh}/${gt}`;
  });
}

function applyFilter() {
  const q = searchQ.toLowerCase();

  GROUPS.forEach(g => {
    let groupVisible = false;
    g.teams.forEach(t => {
      const card = document.getElementById('tc-' + t.id);
      if (!card) return;

      const stickers = card.querySelectorAll('.sticker');
      let cardVisible = false;

      stickers.forEach(s => {
        const qty = parseInt(s.dataset.qty) || 0;
        const name = s.dataset.name || '';
        const num = s.dataset.num || '';

        let filterOk = true;
        if (activeFilter === 'missing') filterOk = qty === 0;
        else if (activeFilter === 'duplicates') filterOk = qty >= 2;

        let searchOk = true;
        if (q) searchOk = name.includes(q) || num.includes(q) || t.name.toLowerCase().includes(q);

        const visible = filterOk && searchOk;
        s.style.display = visible ? '' : 'none';
        if (visible) { cardVisible = true; groupVisible = true; }
      });

      card.classList.toggle('hidden', !cardVisible);

      // Auto-open if searching
      if (q && cardVisible) card.classList.add('open');
      else if (q && !cardVisible) card.classList.remove('open');
    });

    const sec = document.getElementById('group-' + g.id);
    if (sec) sec.classList.toggle('empty', !groupVisible);
  });

  const anyVisible = GROUPS.some(g => !document.getElementById('group-' + g.id)?.classList.contains('empty'));
  document.getElementById('no-results').style.display = anyVisible ? 'none' : 'block';
}

// ─── EXPORT / IMPORT ─────────────────────────────────────────
function exportData() {
  const data = { version: 1, quantities };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'album-copa-2026.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('✅ Progresso exportado!');
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      quantities = data.quantities || data;
      saveState();
      buildUI();
      showToast('✅ Progresso importado!');
    } catch {
      showToast('❌ Arquivo inválido');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
}

function resetAll() {
  if (!confirm('Zerar todo o progresso? Esta ação não pode ser desfeita.')) return;
  quantities = {};
  saveState();
  buildUI();
  showToast('↺ Progresso zerado');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ─── EVENTS ──────────────────────────────────────────────────
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    applyFilter();
  });
});

document.getElementById('search').addEventListener('input', e => {
  searchQ = e.target.value.trim();
  applyFilter();
});

// ─── INIT ────────────────────────────────────────────────────
loadState();
buildUI();
</script>
