<style>
:root{
  --gold:#C9A84C;--gold-l:#E8C96A;
  --bg:#0C1018;--surf:#141B26;--surf2:#1C2636;--surf3:#222E42;
  --bd:rgba(201,168,76,.15);--bd2:rgba(255,255,255,.07);
  --text:#EEE9DF;--muted:#7A8BA8;
  --green:#27AE60;--gbg:rgba(39,174,96,.13);--gbd:rgba(39,174,96,.45);
  --orange:#E67E22;--obg:rgba(230,126,34,.13);--obd:rgba(230,126,34,.45);
  --red:#E74C3C;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;display:flex;flex-direction:column}

/* HEADER */
header{height:56px;background:var(--surf);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0}
.logo{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:var(--gold);letter-spacing:2px;white-space:nowrap;line-height:1}
.logo span{color:var(--muted);font-size:1rem}
.hprog{flex:1;min-width:0}
.hnums{display:flex;justify-content:space-between;font-size:.68rem;color:var(--muted);margin-bottom:4px}
.hnums strong{color:var(--gold-l)}
.pt{height:5px;background:var(--surf2);border-radius:99px;overflow:hidden}
.pf{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-l));border-radius:99px;transition:width .4s;width:0%}

/* FILTER BAR */
.fbar{height:46px;background:var(--surf);border-bottom:1px solid var(--bd2);display:flex;align-items:center;padding:0 10px;gap:6px;flex-shrink:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.fbar::-webkit-scrollbar{display:none}
.sw{position:relative;flex-shrink:0}
.sw svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:13px;height:13px;fill:none;stroke:var(--muted);stroke-width:2;pointer-events:none}
.sw input{background:var(--surf2);border:1px solid var(--bd2);color:var(--text);border-radius:8px;padding:6px 8px 6px 26px;font-family:'DM Sans',sans-serif;font-size:.78rem;width:128px;outline:none}
.sw input::placeholder{color:var(--muted)}
.sw input:focus{border-color:var(--gold)}
.pill{flex-shrink:0;background:var(--surf2);border:1px solid var(--bd2);color:var(--muted);border-radius:99px;padding:5px 11px;font-family:'DM Sans',sans-serif;font-size:.74rem;cursor:pointer;white-space:nowrap;-webkit-user-select:none;user-select:none}
.pill.on{background:var(--gold);color:#0C1018;border-color:var(--gold);font-weight:600}

/* STATS */
.srow{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--bd2);border-bottom:1px solid var(--bd2);flex-shrink:0}
.sc2{background:var(--surf);text-align:center;padding:6px 2px}
.sc2 .n{font-family:'Bebas Neue',sans-serif;font-size:1.25rem;color:var(--gold);line-height:1}
.sc2 .l{font-size:.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:1px}

/* SCROLL */
.sa{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* GROUPS */
.gs{margin-bottom:2px}
.gs.hid{display:none}
.gh{display:flex;align-items:center;padding:8px 12px 5px;gap:8px}
.gl{font-family:'Bebas Neue',sans-serif;font-size:.9rem;color:var(--gold);letter-spacing:2px}
.gp{font-size:.65rem;color:var(--muted);background:var(--surf2);padding:2px 7px;border-radius:99px;margin-left:auto}

/* TEAM */
.tb{margin-bottom:1px}
.tb.hid{display:none}
.th{display:flex;align-items:center;padding:9px 12px;background:var(--surf);gap:8px;cursor:pointer;-webkit-user-select:none;user-select:none;border-top:1px solid var(--bd2)}
.tf{font-size:1.3rem;line-height:1}
.tn{font-weight:500;font-size:.85rem;flex:1}
.ts{font-size:.68rem;color:var(--gold);font-weight:600;white-space:nowrap}
.cv{font-size:.55rem;color:var(--muted);transition:transform .2s;margin-left:3px}
.tb.open .cv{transform:rotate(180deg)}

/* STICKER GRID */
.sg{display:none;grid-template-columns:repeat(5,1fr);gap:3px;padding:5px 7px 8px;background:var(--bg)}
.tb.open .sg{display:grid}

/* CELL */
.sc{background:var(--surf2);border:1.5px solid var(--bd2);border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px 4px;transition:border-color .12s,background .12s,opacity .12s}
.sn{font-size:.58rem;color:var(--muted);line-height:1;font-weight:500}
.si{width:30px;height:30px;border-radius:5px;background:var(--surf3);display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:600;color:var(--muted);text-align:center;line-height:1.2;position:relative;flex-shrink:0}
.sqb{display:none;position:absolute;top:-5px;right:-5px;background:var(--orange);color:#fff;font-size:.5rem;font-weight:700;border-radius:99px;min-width:14px;height:14px;align-items:center;justify-content:center;padding:0 2px;line-height:1}
.sct{display:flex;align-items:center;gap:2px;margin-top:2px}
.sb{width:22px;height:22px;border-radius:6px;border:1px solid var(--bd2);background:var(--surf3);color:var(--muted);font-size:1rem;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-user-select:none;user-select:none;font-family:'DM Sans',sans-serif;line-height:1;touch-action:manipulation;transition:all .1s}
.sb:active{transform:scale(.82)}
.sb.plus:active{background:var(--green);color:#fff;border-color:var(--green)}
.sb.minus:active{background:var(--red);color:#fff;border-color:var(--red)}
.sv{font-size:.7rem;font-weight:600;color:var(--muted);min-width:13px;text-align:center;line-height:1}

/* STATES */
.sc[data-q="0"]{opacity:.42}
.sc[data-q="1"]{opacity:1;border-color:var(--gbd);background:var(--gbg)}
.sc[data-q="1"] .sv,.sc[data-q="1"] .sn{color:var(--green)}
.sc[data-q="2"],.sc[data-q="3"],.sc[data-q="4"],.sc[data-q="5"],.sc[data-q="6"],.sc[data-q="7"],.sc[data-q="8"],.sc[data-q="9"]{opacity:1;border-color:var(--obd);background:var(--obg)}
.sc[data-q="2"] .sv,.sc[data-q="3"] .sv,.sc[data-q="4"] .sv,.sc[data-q="5"] .sv,.sc[data-q="6"] .sv,.sc[data-q="7"] .sv,.sc[data-q="8"] .sv,.sc[data-q="9"] .sv,
.sc[data-q="2"] .sn,.sc[data-q="3"] .sn,.sc[data-q="4"] .sn,.sc[data-q="5"] .sn,.sc[data-q="6"] .sn,.sc[data-q="7"] .sn,.sc[data-q="8"] .sn,.sc[data-q="9"] .sn{color:var(--orange)}
.sc:not([data-q="0"]):not([data-q="1"]) .sqb{display:flex}
.sc.sp .si{background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.3);font-size:.9rem}

/* IO BAR */
.io{border-top:1px solid var(--bd2);background:var(--surf);display:flex;align-items:center;padding:6px 10px;gap:6px;flex-shrink:0}
.ib{background:var(--surf2);border:1px solid var(--bd2);color:var(--muted);border-radius:8px;padding:6px 11px;font-family:'DM Sans',sans-serif;font-size:.72rem;cursor:pointer}
.ib.danger{color:var(--red);border-color:rgba(231,76,60,.25)}
.ib.ml{margin-left:auto}
.save-hint{font-size:.62rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* EMPTY */
.em{text-align:center;padding:40px 20px;color:var(--muted);font-size:.85rem;display:none}
.em .ico{font-size:2.5rem;margin-bottom:8px}

/* TOAST */
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--surf2);border:1px solid var(--bd);color:var(--text);padding:7px 16px;border-radius:99px;font-size:.8rem;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(min-width:480px){.sg{grid-template-columns:repeat(6,1fr)}}
@media(min-width:700px){.sg{grid-template-columns:repeat(8,1fr)}.sw input{width:180px}}
</style>
</head>

const ALL_TEAMS = [FWC, ...TEAMS];
const TOTAL = ALL_TEAMS.reduce((s,t)=>s+t.stickers.length,0); // ~983, usaremos 980

const GROUP_ORDER = ['FWC','A','B','C','D','E','F','G','H','I','J','K','L'];

// ─── STATE ────────────────────────────────────────────────────────────────────
let qty={}, filt='all', srch='';

function load(){try{const s=localStorage.getItem('copa26v3');if(s)qty=JSON.parse(s)}catch(e){}}
function save(){localStorage.setItem('copa26v3',JSON.stringify(qty))}
function K(tid,n){return tid+'_'+n}
function getQ(tid,n){return qty[K(tid,n)]||0}
function setQ(tid,n,v){if(v<=0)delete qty[K(tid,n)];else qty[K(tid,n)]=Math.min(v,9);save()}

function ini(label){
  return label.split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?'
}

// ─── BUILD UI ─────────────────────────────────────────────────────────────────
function buildAll(){
  const sa=document.getElementById('sa');
  sa.innerHTML='<div class="em" id="em"><div class="ico">🔍</div>Nenhuma figurinha encontrada</div>';

  const byG={};
  ALL_TEAMS.forEach(t=>{if(!byG[t.g])byG[t.g]=[];byG[t.g].push(t)});

  GROUP_ORDER.forEach(gk=>{
    if(!byG[gk])return;
    const sec=document.createElement('div');
    sec.className='gs';sec.id='gs-'+gk;

    const lbl=gk==='FWC'?'Especiais Copa':'Grupo '+gk;
    const gh=document.createElement('div');
    gh.className='gh';
    gh.innerHTML=`<span class="gl">${lbl}</span><span class="gp" id="gp-${gk}">0/0</span>`;
    sec.appendChild(gh);

    byG[gk].forEach(team=>{
      const tb=document.createElement('div');
      tb.className='tb';tb.id='tb-'+team.id;

      const th=document.createElement('div');
      th.className='th';
      th.innerHTML=`<span class="tf">${team.flag}</span><span class="tn">${team.name}</span><span class="ts" id="ts-${team.id}">0/${team.stickers.length}</span><span class="cv">▼</span>`;
      th.onclick=()=>tb.classList.toggle('open');
      tb.appendChild(th);

      const grid=document.createElement('div');
      grid.className='sg';

      team.stickers.forEach(s=>{
        const q=getQ(team.id,s.n);
        const cell=document.createElement('div');
        cell.className='sc'+(s.sp?' sp':'');
        cell.dataset.q=q;
        cell.dataset.n=s.n;
        cell.dataset.tid=team.id;
        cell.dataset.lb=(team.id+' '+s.n+' '+s.label).toLowerCase();

        const ico=s.sp?'⭐':ini(s.label);
        // Label da figurinha: "MEX 1", "BRA 14" etc.
        const numLabel=team.id+' '+s.n;

        cell.innerHTML=
          `<span class="sn">${numLabel}</span>`+
          `<div class="si">${ico}<div class="sqb">${q}x</div></div>`+
          `<div class="sct">`+
            `<div class="sb minus" data-n="${s.n}" data-tid="${team.id}">−</div>`+
            `<span class="sv">${q}</span>`+
            `<div class="sb plus" data-n="${s.n}" data-tid="${team.id}">+</div>`+
          `</div>`;
        grid.appendChild(cell);
      });

      grid.addEventListener('click',e=>{
        const btn=e.target.closest('.sb');if(!btn)return;
        const n=+btn.dataset.n,tid=btn.dataset.tid;
        const cur=getQ(tid,n);
        const next=btn.classList.contains('plus')?cur+1:Math.max(0,cur-1);
        setQ(tid,n,next);
        const cell=btn.closest('.sc');
        cell.dataset.q=next;
        cell.querySelector('.sv').textContent=next;
        cell.querySelector('.sqb').textContent=next+'x';
        updateStats();
        applyFilter();
      });

      tb.appendChild(grid);
      sec.appendChild(tb);
    });
    sa.appendChild(sec);
  });

  updateStats();
  applyFilter();
}

// ─── STATS ────────────────────────────────────────────────────────────────────
function updateStats(){
  let have=0,dups=0;
  ALL_TEAMS.forEach(t=>{
    let th=0;
    t.stickers.forEach(s=>{
      const q=getQ(t.id,s.n);
      if(q>=1){have++;th++;}
      if(q>=2)dups+=q-1;
    });
    const el=document.getElementById('ts-'+t.id);
    if(el)el.textContent=th+'/'+t.stickers.length;
  });

  // Group totals
  const byG={};
  ALL_TEAMS.forEach(t=>{
    if(!byG[t.g])byG[t.g]={h:0,t:0};
    t.stickers.forEach(s=>{
      byG[t.g].t++;
      if(getQ(t.id,s.n)>=1)byG[t.g].h++;
    });
  });
  Object.keys(byG).forEach(g=>{
    const el=document.getElementById('gp-'+g);
    if(el)el.textContent=byG[g].h+'/'+byG[g].t;
  });

  const tot=TOTAL;
  const miss=tot-have;
  const pct=Math.round(have/tot*100);
  document.getElementById('h-have').textContent=have;
  document.getElementById('s-have').textContent=have;
  document.getElementById('s-miss').textContent=miss;
  document.getElementById('s-dups').textContent=dups;
  document.getElementById('s-pct').textContent=pct+'%';
  document.getElementById('pf').style.width=pct+'%';
}

// ─── FILTER ───────────────────────────────────────────────────────────────────
function applyFilter(){
  const q=srch.toLowerCase();
  let anyVis=false;
  const gVis={};

  ALL_TEAMS.forEach(t=>{
    let tVis=false;
    const tb=document.getElementById('tb-'+t.id);if(!tb)return;

    tb.querySelectorAll('.sc').forEach(cell=>{
      const qv=+cell.dataset.q;
      const lb=cell.dataset.lb;
      let fOk=filt==='all'||(filt==='missing'&&qv===0)||(filt==='dups'&&qv>=2);
      let sOk=!q||lb.includes(q)||t.name.toLowerCase().includes(q);
      const vis=fOk&&sOk;
      cell.style.display=vis?'':'none';
      if(vis)tVis=true;
    });

    tb.classList.toggle('hid',!tVis);
    if(tVis){anyVis=true;gVis[t.g]=true;if(q)tb.classList.add('open');}
    const gs=document.getElementById('gs-'+t.g);
    if(gs)gs.classList.toggle('hid',!gVis[t.g]);
  });

  document.getElementById('em').style.display=anyVis?'none':'block';
}

// ─── EXPORT / IMPORT / RESET ──────────────────────────────────────────────────
function exportData(){
  const blob=new Blob([JSON.stringify({v:3,qty},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='copa2026.json';a.click();URL.revokeObjectURL(url);
  toast('✅ Exportado!');
}
function importData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      qty=d.qty||d.quantities||d;
      save();buildAll();toast('✅ Importado!');
    }catch{toast('❌ Arquivo inválido');}
    e.target.value='';
  };r.readAsText(f);
}
function resetAll(){
  if(!confirm('Zerar todo o progresso? Não pode ser desfeito.'))return;
  qty={};save();buildAll();toast('↺ Zerado!');
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

// ─── EVENTS ───────────────────────────────────────────────────────────────────
document.querySelectorAll('.pill').forEach(p=>{
  p.addEventListener('click',()=>{
    document.querySelectorAll('.pill').forEach(x=>x.classList.remove('on'));
    p.classList.add('on');filt=p.dataset.f;applyFilter();
  });
});
document.getElementById('srch').addEventListener('input',e=>{
  srch=e.target.value.trim();applyFilter();
});
document.getElementById('btn-exp').addEventListener('click',exportData);
document.getElementById('btn-imp').addEventListener('click',()=>document.getElementById('fi').click());
document.getElementById('fi').addEventListener('change',importData);
document.getElementById('btn-rst').addEventListener('click',resetAll);

// ─── INIT ─────────────────────────────────────────────────────────────────────
load();buildAll();
</script>
